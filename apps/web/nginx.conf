server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Поток изменений: буферизация и короткий таймаут убили бы Server-Sent Events.
    location /api/v1/orders/stream {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # Фронтенд и API живут на одном origin — CORS в продакшене не нужен.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Без этого браузер не увидит ETag и не сможет прислать If-Match.
        proxy_pass_header ETag;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
