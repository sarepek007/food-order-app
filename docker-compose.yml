# Полный стенд одной командой:
#   docker compose up -d --build
#
# Порты и параметры переопределяются через .env — см. .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: food-order-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food}
      POSTGRES_DB: ${POSTGRES_DB:-food_orders}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Заводит отдельные базы для интеграционных тестов и e2e.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-food} -d ${POSTGRES_DB:-food_orders}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Явный тег: тот же образ переиспользует сервис seed, иначе он собирался бы
    # отдельно и легко оставался устаревшим после пересборки api.
    image: food-order-app-api:latest
    container_name: food-order-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-food}:${POSTGRES_PASSWORD:-food}@postgres:5432/${POSTGRES_DB:-food_orders}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COURIER_ACTIVE_LIMIT: ${COURIER_ACTIVE_LIMIT:-3}
      SEARCH_SIMILARITY_THRESHOLD: ${SEARCH_SIMILARITY_THRESHOLD:-0.5}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      # Стенд должен подниматься одной командой: если база пуста,
      # приложение само загрузит демонстрационный набор.
      SEED_ON_EMPTY: 'true'
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: food-order-web
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget есть в nginx:alpine; -q -O- не пишет файлов.
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1/ > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Пересоздание демонстрационных данных поверх существующих.
  # При первом запуске не нужен: пустую базу наполняет сам api
  # (SEED_ON_EMPTY). Нужен, чтобы вернуть стенд в исходное состояние:
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: food-order-app-api:latest
    container_name: food-order-seed
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-food}:${POSTGRES_PASSWORD:-food}@postgres:5432/${POSTGRES_DB:-food_orders}
      COURIER_ACTIVE_LIMIT: ${COURIER_ACTIVE_LIMIT:-3}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']
    command: ['node', 'dist/seed/seed-cli.js']

volumes:
  postgres-data:
