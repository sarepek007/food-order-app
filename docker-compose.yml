services:
  postgres:
    image: postgres:16-alpine
    container_name: food-order-postgres
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: food_orders
      # Ускоряет тесты: дурабельность на локальной машине не нужна.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U food -d food_orders']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
